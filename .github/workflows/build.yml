name: Build Fabric release candidates

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - "1.21"
          - "1.21.1"
          - "1.21.2"
          - "1.21.3"
          - "1.21.4"
          - "1.21.5"
          - "1.21.6"
          - "1.21.7"
          - "1.21.8"
          - "1.21.9"
          - "1.21.10"
          - "1.21.11"
          - "26.1"
          - "26.1.1"
          - "26.1.2"
          - "26.2"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21 toolchain
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Java 25 runtime
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Normalize Gradle Wrapper line endings
        run: sed -i 's/\r$//' gradlew

      - name: Build and verify range JAR
        run: >-
          bash ./gradlew --no-daemon --stacktrace
          -Porg.gradle.java.installations.paths="$JAVA_HOME_21_X64,$JAVA_HOME_25_X64"
          :${{ matrix.minecraft }}:buildAndCollect

      - name: Upload runtime JAR
        if: ${{ contains(fromJSON('["1.21","1.21.1","1.21.2","1.21.5","1.21.6","1.21.9","1.21.11","26.1","26.2"]'), matrix.minecraft) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autostock-${{ matrix.minecraft }}-candidate
          path: build/releases/autostock-*-1.0.jar
          if-no-files-found: error
          retention-days: 14
